<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스트리머 - 스버스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="period.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    :root {
      --bg: #05070a;
      --bg-elevated: #0b0e14;
      --bg-card: #0b0e14;
      --border: #141923;
      --text: #e8eaed;
      --text-muted: #8b8f9a;
      --text-dim: #475569;
      --cyan: #22d3ee;
      --neon-green: #00ff9d;
      --neon-red: #ff3344;
      --orange: #f59e0b;
      --header-h: 56px;
      --content-max: 1440px;

      /* ==========================================
         [★ 전체 조절 리모컨 ★]
         ========================================== */
      --card-radius: 12px;       /* 큰 카드 상자들 모서리 둥글기 */
      --btn-radius: 6px;         /* 모든 버튼/토글/칩 모서리 둥글기 */
      --btn-height: 32px;        /* 토글/버튼 높이 */
      --btn-padding-x: 12px;     /* 토글/버튼 좌우 여백 */
    }

    html { scrollbar-gutter: stable; }
    html.light {
      --cyan: #16325c;
      --bg: #f3f4f7;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --border: rgba(15, 18, 24, 0.1);
      --text: #1a1d24;
      --text-muted: #5c606b;
      --text-dim: #8a8f99;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; line-height: 1.5;
      display: flex; flex-direction: column;
    }

    .main {
      flex: 1; max-width: var(--content-max); width: 100%;
      margin: 0 auto; padding: 20px 24px 40px;
      display: flex; flex-direction: column; gap: 14px;
    }

    @keyframes profileSpin { to { transform: rotate(360deg); } }
    #profileLoading {
      display: flex; min-height: 400px; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; color: var(--text-dim); font-size: 14px;
    }
    #profileLoading .profile-spin {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: var(--cyan); border-radius: 50%;
      animation: profileSpin 0.8s linear infinite;
    }

    .side-box,
    .profile-vertical-card,
    .chart-box-card,
    .streak-container-shader {
      border-radius: var(--card-radius) !important;
    }

    .side-box {
      background: var(--bg-card); border: 1px solid var(--border);
      overflow: hidden;
    }
    .side-box-header {
      padding: 11px 16px; background: #11141d; border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 700; color: #cbd5e1;
      display: flex; align-items: center; justify-content: space-between;
    }

    .dashboard-split-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: flex-start;
      width: 100%;
    }
    .dashboard-left-stream {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .top-dual-grid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 14px;
      align-items: stretch;
    }
    .dashboard-right-rail {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 340px;
    }

    /* [좌측] 프로필 카드 */
    .profile-vertical-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%; overflow: hidden;
      border: 2px solid var(--cyan); background: #1a1c24; margin-bottom: 10px;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name {
      font-size: 20px; font-weight: 700; line-height: 1.2;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .race-letter { font-size: 22px; font-weight: 800; line-height: 1; }
    .race-letter.T { color: #3b93ff; }
    .race-letter.P { color: #fbbf24; }
    .race-letter.Z { color: #c084fc; }
    .name-emblem { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
    .name-emblem img { max-width: 22px; max-height: 22px; object-fit: contain; }

    .profile-badges { display: flex; gap: 5px; margin: 6px 0 10px; }
    .meta-badge {
      font-size: 11px; padding: 2px 7px; border-radius: var(--btn-radius);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text-muted); font-weight: 500;
    }
    .tick-num {
      font-family: 'Orbitron', sans-serif; font-weight: 800; color: #ff4fa3; font-size: 12px;
    }

    .profile-stat-rows {
      width: 100%; border-top: 1px solid var(--border); padding-top: 10px;
      display: flex; flex-direction: column; gap: 6.5px; font-size: 12px;
    }
    .stat-row-item {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--text-dim);
    }
    .stat-row-val { color: var(--text); font-weight: 600; }
    .stat-row-val b { color: var(--cyan); }

    /* 30px 정사각형 SNS 버튼 */
    .sns-links-grid {
      display: flex; gap: 10px; align-items: center; justify-content: center;
      margin-top: 14px;
    }
    .sns-icon-btn {
      width: 30px; height: 30px; border-radius: var(--btn-radius);
      background: #11141d; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; position: relative; overflow: hidden;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sns-icon-btn img {
      width: 18px; height: 18px; object-fit: contain;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .sns-icon-btn.soop:hover {
      border-color: #22d3ee; background: #151a26; transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(34, 211, 238, 0.35);
    }
    .sns-icon-btn.soop:hover img {
      transform: scale(1.1); filter: drop-shadow(0 0 3px rgba(34, 211, 238, 0.6));
    }
    .sns-icon-btn.insta:hover {
      border-color: #e1306c; background: #19121c; transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(225, 48, 108, 0.4);
    }
    .sns-icon-btn.insta:hover img {
      transform: scale(1.1); filter: drop-shadow(0 0 3px rgba(225, 48, 108, 0.6));
    }

    /* [좌측] 핵심통계분석 차트 박스 */
    .chart-box-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    }
    .chart-box-top {
      padding: 10px 16px; background: #11141d; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chart-tab-group { display: flex; gap: 5px; }
    .chart-tab-btn {
      padding: 5px var(--btn-padding-x); border-radius: var(--btn-radius); border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .chart-tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .chart-tab-btn.active {
      color: #05070a; background: var(--cyan); border-color: var(--cyan); font-weight: 700;
    }

    .chart-render-area {
      flex: 1; padding: 6px 10px 0; min-height: 285px; position: relative;
      display: flex; flex-direction: column;
    }
    #mainApexChartContainer {
      width: 100%; height: 100%; min-height: 280px;
    }

    .chart-bottom-info {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 14px; border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }
    .chart-info-cell { text-align: center; }
    .chart-info-lbl { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
    .chart-info-num { font-size: 15px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
    .chart-info-sub { font-size: 11px; color: var(--text-muted); margin-left: 3px; }

    /* [좌측] RECENT FORM */
    .streak-container-shader {
      background-color: #0b0e14; border: 1px solid var(--border);
      padding: 12px 20px; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
    }
    .streak-tag {
      font-size: 12px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px;
    }
    .shader-track-bar {
      display: flex; width: 340px; height: 8px; background-color: #0d111a;
      border-radius: 4px; overflow: hidden; position: relative;
    }
    .shader-match-segment {
      height: 100%; flex: 1; margin-right: 2px;
      background-color: #1a2233;
      transition: background-color 0.25s ease, transform 0.25s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .shader-match-segment:last-child { margin-right: 0; }
    .shader-match-segment.win { background-color: var(--neon-green); }
    .shader-match-segment.loss { background-color: var(--neon-red); }
    .shader-match-segment:hover { filter: brightness(1.5); transform: scaleY(1.3); }

    .shader-scan-beam {
      position: absolute; top: 0; left: -40px;
      width: 40px; height: 100%;
      background: linear-gradient(90deg, transparent, var(--cyan), #fff, transparent);
      opacity: 0; pointer-events: none;
    }

    @keyframes streakHotGlow {
      0% { filter: brightness(1) drop-shadow(0 0 1px var(--neon-green)); }
      50% { filter: brightness(1.7) drop-shadow(0 0 6px var(--neon-green)); }
      100% { filter: brightness(1) drop-shadow(0 0 1px var(--neon-green)); }
    }
    .streak-hot { animation: streakHotGlow 1.2s infinite ease-in-out; }

    .streak-stat-text {
      font-size: 12.5px; font-weight: 700; color: #cbd5e1;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }

    /* [좌측] 경기 전적 필터 */
    .filter-check-group { display: flex; gap: 6px; align-items: center; }
    .filter-check-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 var(--btn-padding-x);
      height: var(--btn-height);
      border-radius: var(--btn-radius);
      border: 1px solid var(--border);
      background: #0e121a; color: var(--text-muted); font-size: 12px; font-weight: 600;
      cursor: pointer; user-select: none; transition: all 0.15s ease;
    }
    .filter-check-chip:hover { border-color: #2e3b54; color: var(--text); }
    .filter-check-chip .chip-box {
      width: 12px; height: 12px; border-radius: 3px;
      border: 1px solid #334155; background: #080b11;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .filter-check-chip.active {
      color: #f1f5f9; border-color: var(--border); background: #0e121a;
    }
    .filter-check-chip.active .chip-box {
      background: var(--cyan); border-color: var(--cyan);
    }
    .filter-check-chip.active .chip-box::after {
      content: ''; width: 3px; height: 6px; border: solid #05070a;
      border-width: 0 1.8px 1.8px 0; transform: rotate(45deg) translate(-0.5px, -0.5px);
    }

    .match-row {
      display: grid; grid-template-columns: 50px 2fr 1fr 110px;
      gap: 12px; align-items: center; padding: 9px 20px; font-size: 13px;
    }
    .match-row:nth-child(odd) { background: rgba(255,255,255,0.015); }
    .match-row:hover { background: rgba(34,211,238,0.08); }
    .wl-badge {
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800;
    }
    .wl-w { background: rgba(0, 255, 157, 0.15); color: var(--neon-green); }
    .wl-l { background: rgba(255, 51, 68, 0.15); color: var(--neon-red); }
    .match-map { color: var(--text-muted); margin-left: 18px; font-size: 12px; }
    .match-pager {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 10px; font-size: 12px; border-top: 1px solid var(--border);
    }
    .match-pager button {
      width: 28px; height: 28px; border-radius: var(--btn-radius); border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); cursor: pointer;
    }
    .match-pager button:hover:not(:disabled) { color: #67e8f9; border-color: rgba(34,211,238,0.35); }

    /* [우측] 토글 셀렉트 박스 */
    .filter-select-toggle-big,
    #radarPeriodSelect {
      height: var(--btn-height) !important;
      padding: 0 var(--btn-padding-x) !important;
      border-radius: var(--btn-radius) !important;
      border: 1px solid var(--border) !important;
      background: #11141d !important;
      color: #cbd5e1 !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      outline: none; cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-select-toggle-big:focus, .filter-select-toggle-big:hover,
    #radarPeriodSelect:focus, #radarPeriodSelect:hover {
      border-color: var(--cyan) !important; color: var(--cyan) !important;
    }

    .filter-side-card {
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #0b0e14;
    }

    /* 5각 레이더 카드 */
    .radar-card-wrap {
      display: flex; flex-direction: column; align-items: center; padding: 10px 14px 14px;
    }
    .radar-svg-area { width: 220px; height: 195px; position: relative; }
    @keyframes radarPulse {
      0% { r: 3.5px; stroke-opacity: 1; stroke-width: 1.5; }
      50% { r: 9px; stroke-opacity: 0.3; stroke-width: 3; }
      100% { r: 3.5px; stroke-opacity: 1; stroke-width: 1.5; }
    }
    .radar-top-pulse { animation: radarPulse 1.8s infinite ease-in-out; transform-origin: center; }

    /* 최근 대회 승률 (육각 코어) */
    .tech-body-compact {
      display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: center; padding: 12px 14px;
    }
    .variant-hexagon {
      position: relative; width: 85px; height: 85px; display: flex; justify-content: center; align-items: center; margin: 0 auto;
    }
    .svg-hexagon { width: 85px; height: 85px; transform: rotate(-90deg); transform-origin: center center; }
    .hex-bg { fill: none; stroke: #161b26; stroke-width: 7; stroke-linejoin: round; }
    .hex-fill {
      fill: none; stroke: var(--neon-green); stroke-width: 7; stroke-linejoin: round;
      stroke-dasharray: 275; stroke-dashoffset: 275; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(0,255,157,0.6));
      transition: stroke-dashoffset 1.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .center-num-style { position: absolute; font-size: 17px; font-weight: 800; color: var(--neon-green); }
    .tech-list-stack { display: flex; flex-direction: column; gap: 6px; list-style: none; }
    .tech-row-chip {
      display: flex; justify-content: space-between; align-items: center;
      background-color: #11141d; border: 1px solid #1c2030; border-radius: var(--btn-radius);
      padding: 5px 9px; transition: all 0.15s ease; cursor: pointer;
    }
    .tech-row-chip:hover { border-color: #2e3b54; background-color: #141824; }
    .tech-name-side { font-size: 11.5px; font-weight: 600; color: #cbd5e1; }
    .tech-stat-side { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
    .tech-score { font-size: 10.5px; color: #64748b; font-weight: 500; }
    .tech-score .w { color: #8b8f9a; margin-right: 2px; }
    .tech-rate { font-size: 11.5px; font-weight: 700; color: var(--neon-green); width: 30px; text-align: right; }
    .tech-row-chip.low-perf .tech-rate { color: #f59e0b; }

    /* 방송 활동 지표 */
    .arch-chart-zone {
      position: relative; width: 100%; height: 115px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden;
    }
    .arch-svg {
      width: 200px; height: 200px; transform: rotate(-180deg); transform-origin: center center; position: absolute; bottom: -100px;
    }
    .arch-track { fill: none; stroke-width: 14; stroke-linecap: round; }
    .arch-bg { stroke: #141923; }
    .arch-fill { transition: stroke-dashoffset 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .color-total { stroke: #0d9488; }
    .color-terran { stroke: #2563eb; }
    .color-zerg { stroke: #8b5cf6; }
    .color-protoss { stroke: #f97316; }

    .race-legend-row {
      display: flex; justify-content: space-between; align-items: center;
      list-style: none; padding: 8px 14px; border-top: 1px solid var(--border); margin: 0;
    }
    .race-legend-inline-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .legend-dot.total { background-color: #0d9488; }
    .legend-dot.terran { background-color: #2563eb; }
    .legend-dot.zerg { background-color: #8b5cf6; }
    .legend-dot.protoss { background-color: #f97316; }
    .race-label-txt { color: #8b8f9a; font-weight: 600; }
    .race-val-txt { color: #f1f5f9; font-weight: 700; font-variant-numeric: tabular-nums; }

    @media (max-width: 1100px) {
      .dashboard-split-layout { grid-template-columns: 1fr; }
      .top-dual-grid { grid-template-columns: 1fr; }
      .dashboard-right-rail { width: 100%; }
      .shader-track-bar { width: 200px; }
    }
  </style>
</head>
<body>
  <div id="site-top"></div>

  <main class="main" id="app">
    <div id="profileLoading">
      <div class="profile-spin"></div>
      <div>데이터를 읽는중입니다</div>
    </div>
  </main>

  <div id="site-bottom"></div>

  <script src="common.js"></script>
  <script src="period.js"></script>
  <script>

    const ROSTER_CSV = SHEET + "&gid=0";

      "철와대": "logo/su_em.webp", "우끼끼즈": "logo/ukks_em.webp", "MSG": "logo/msg_em.webp",
      "와플대": "logo/waffleu_em.webp", "YB": "logo/yb_em.webp", "염석대": "logo/yuam_em.webp",
      "학버드": "logo/hak_em.webp", "철기중대": "logo/chulgi_em.webp", "패션스타": "logo/fstar_em.webp",

      var sorted = list.slice().filter(x => (x[key] || 0) > 0).sort((a, b) => b[key] - a[key]);

        if (sorted[i].id === id) return i + 1;

          id: r ? r.id : "", crew: r ? r.crew : "FA",
          star: s.star, peak: s.peak, avgView: s.avgView, viewership: s.viewership, airMinutes: s.airMinutes, chat: s.chat

      var viewRank = rankOf(linked, person.id, "viewership");
      var airRank = rankOf(linked, person.id, "airMinutes");
      var peakRank = rankOf(linked, person.id, "peak");

      if (!rec) {
        for (var k = 0; k < person.aliases.length; k++) {
          if (matchMap[norm(person.aliases[k])]) { rec = matchMap[norm(person.aliases[k])]; break; }
        }

    function runRandomStreakAnimation(realBits) {
      const mode = Math.floor(Math.random() * 5) + 1;
      const segs = realBits.map((_, i) => document.getElementById(`seg-${i}`));
      const beam = document.getElementById('shaderScanBeam');

      if (mode === 1) {
        realBits.forEach((b, idx) => {
          setTimeout(() => {
            if (segs[idx]) segs[idx].className = 'shader-match-segment ' + (b === 'W' ? 'win' : 'loss');
          }, idx * 45);
        });
      } else if (mode === 2) {
        let step = 0;
        const interval = setInterval(() => {
          segs.forEach((el, idx) => {
            if (!el) return;
            if (idx >= Math.floor(step / 2)) {
              el.className = 'shader-match-segment ' + (Math.random() > 0.5 ? 'win' : 'loss');
            } else {
              el.className = 'shader-match-segment ' + (realBits[idx] === 'W' ? 'win' : 'loss');
            }
          });
          step++;
          if (step > 30) {
            clearInterval(interval);
            segs.forEach((el, idx) => {
              if (el) el.className = 'shader-match-segment ' + (realBits[idx] === 'W' ? 'win' : 'loss');
            });
          }
        }, 40);
      } else if (mode === 3) {
        if (beam) {
          beam.style.opacity = '1';
          beam.style.transition = 'left 0.4s ease-in-out';
          beam.style.left = '100%';
          setTimeout(() => {
            beam.style.transition = 'left 0.4s ease-in-out';
            beam.style.left = '-40px';
            realBits.forEach((b, idx) => {
              setTimeout(() => {
                if (segs[idx]) segs[idx].className = 'shader-match-segment ' + (b === 'W' ? 'win' : 'loss');
              }, idx * 25);
            });
            setTimeout(() => { beam.style.opacity = '0'; }, 400);
          }, 450);
        }
      } else if (mode === 4) {
        realBits.forEach((b, idx) => {
          if (!segs[idx]) return;
          segs[idx].style.transform = 'scaleY(0)';
          segs[idx].style.transformOrigin = 'bottom';
          setTimeout(() => {
            segs[idx].className = 'shader-match-segment ' + (b === 'W' ? 'win' : 'loss');
            segs[idx].style.transform = 'scaleY(1)';
          }, idx * 50);
        });
      } else if (mode === 5) {
        realBits.forEach((b, idx) => {
          setTimeout(() => {
            if (!segs[idx]) return;
            segs[idx].className = 'shader-match-segment ' + (b === 'W' ? 'win' : 'loss');
          }, idx * 40);
        });

        setTimeout(() => {
          let maxStreak = 0, curStreak = 0, maxStart = -1, curStart = -1;
          realBits.forEach((b, idx) => {
            if (b === 'W') {
              if (curStreak === 0) curStart = idx;
              curStreak++;
              if (curStreak > maxStreak) {
                maxStreak = curStreak;
                maxStart = curStart;
              }
            } else {
              curStreak = 0;
            }
          });
          if (maxStreak >= 3) {
            for (let k = maxStart; k < maxStart + maxStreak; k++) {
              if (segs[k]) segs[k].classList.add('streak-hot');
            }
          }
        }, 15 * 40 + 100);
      }
    }

    function splitCsvRow(line) {
      var cells = [];
      var cur = '';
      var inQuotes = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          cells.push(cur.replace(/^"|"$/g, '').trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      cells.push(cur.replace(/^"|"$/g, '').trim());
      return cells;
    }

    function parseRoster(text) {
      var lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      if (lines.length < 2) return [];

      var headers = splitCsvRow(lines[0]);
      var birthIdx = headers.findIndex(h => h.includes("생일") || h.includes("생년월일") || h.toLowerCase().includes("birth"));
      if (birthIdx === -1) birthIdx = 8;

      var instaIdx = headers.findIndex(h => h.includes("인스타") || h.toLowerCase().includes("insta"));
      if (instaIdx === -1) instaIdx = 7;

      var startIdx = headers.findIndex(h => h.includes("스타시작") || h.includes("시작일") || h.includes("시작"));
      if (startIdx === -1) startIdx = 6;

      var list = [];
      for (var i = 1; i < lines.length; i++) {
        var c = splitCsvRow(lines[i]);
        if (!c[0] && !c[1]) continue;
        list.push({
          id: c[0] || "",
          name: c[1] || "",
          aliases: (c[2] || "").split(",").map(x => x.trim()).filter(Boolean),
          race: c[3] || "",
          crew: c[4] || "FA",
          gender: c[5] || "",
          started: c[startIdx] || "",
          insta: c[instaIdx] || "",
          birthday: c[birthIdx] || ""
        });
      }
      return list;
    }

    function parseStats(text) {
      var lines = text.split("\n").map(l => l.trim()).filter(Boolean);
      var list = [];
      for (var i = 1; i < lines.length; i++) {
        var c = splitCsvRow(lines[i]);
        var name = (c[1] || "").trim();
        if (!name || name === "닉네임") continue;

        list.push({
          date: (c[0] || "").trim(),
          name: name,
          star: num(c[2]),
          peak: num(c[3]),
          avgView: num(c[4]),
          viewership: num(c[5]),
          airMinutes: num(c[6]),
          chat: num(c[7])
        });
      }
      return list;
    }

              var w = num(mc[3]);
              var l = num(mc[4]);
              matchMap[norm(mName)] = { name: mName, win: w, lose: l, games: w + l };
            }
          }
        } catch(e) {}

        renderProfile(person, statsList, matchMap);
      } catch (e) {
        console.error(e);
        renderEmpty("데이터를 불러오는 중 오류가 발생했습니다.");
      }
    }

    start();
  </script>
</body>
</html>
