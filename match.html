<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스폰판수 랭킹 - 스버스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="period.css">
  <style>
    :root {
      --bg: #0a0b0f;
      --bg-elevated: #12141a;
      --bg-card: #16181f;
      --border: rgba(255, 255, 255, 0.06);
      --text: #e8eaed;
      --text-muted: #8b8f9a;
      --text-dim: #5c606b;
      --cyan: #22d3ee;
      --orange: #f59e0b;
      --radius: 14px;
      --header-h: 56px;
      --content-max: 1280px;
    }
    html { scrollbar-gutter: stable; }
    html.light {
      --cyan: #16325c;
      --bg: #f3f4f7;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --border: rgba(15, 18, 24, 0.1);
      --text: #1a1d24;
      --text-muted: #5c606b;
      --text-dim: #8a8f99;
    }
    html.light .header,
    html.light .sub-nav {

    }
    html.light .footer { background: #eceef2; }
    html.light .search-drop,

    html.light .fa-switch-slider { background: rgba(0,0,0,0.18); }
    .theme-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: var(--text);
      flex-shrink: 0;
    }
    .theme-icon svg { width: 20px; height: 20px; display: block; }
    .theme-sun { display: none !important; }
    .theme-moon { display: block !important; }
    html.light .theme-moon { display: none !important; }
    html.light .theme-sun { display: block !important; }
    .fa-switch-wrap {

      cursor: pointer; flex-shrink: 0; user-select: none;
    }
    .fa-switch-input { display: none; }
    .fa-switch-slider {
      width: 36px; height: 20px; background: rgba(255,255,255,0.12);
      border-radius: 999px; position: relative;
    }
    .fa-switch-slider::before {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px; background: #c0c4cc; border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
    }
    .fa-switch-input:checked + .fa-switch-slider { background: rgba(245,158,11,0.35); }
    .fa-switch-input:checked + .fa-switch-slider::before {
      transform: translateX(16px); background: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-h);
      background: rgba(10, 11, 15, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: center;
    }
    .header-inner {
      max-width: var(--content-max); width: 100%;
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
    }
        .logo {
      display: flex; align-items: center; gap: 4px;
      text-decoration: none; color: var(--text); font-weight: 700; font-size: 17px; flex-shrink: 0;
      line-height: 1;
    }
    .logo img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: block;
      position: relative;
      top: 0;
    }
    .logo-text {
      display: flex;
      align-items: center;
      position: relative;
      top: 2px;
    }
    .logo-sub {
      font-size: 70%;
      font-weight: 500;
      color: var(--text-dim);
      margin-left: 8px;
    }
    .search-wrap {
      flex: 1; max-width: 360px; margin-left: auto; position: relative;
    }
    .search-input {
      width: 100%; height: 36px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 40px 0 16px;
      color: var(--text); font-size: 13px; outline: none;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-icon {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); color: var(--text-dim); pointer-events: none;
    }
    .search-drop {
      display: none; position: absolute; top: 42px; left: 0; right: 0;
      background: #16181f; border: 1px solid var(--border); border-radius: 12px;
      max-height: 280px; overflow: auto; z-index: 120;
    }
    .search-drop.open { display: block; }
    .search-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; cursor: pointer; font-size: 13px;
    }
    .search-item:hover { background: rgba(34,211,238,0.1); }
    .search-item img {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #1a1c24;
    }
    .search-item small { color: var(--text-dim); margin-left: auto; }
    .icon-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: none; background: transparent;
      color: var(--text-muted); cursor: pointer;
    }
    .main {
      flex: 1; max-width: var(--content-max);
      width: 100%; margin: 0 auto;
      padding: 28px 24px 40px;
    }
    .page-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .period-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .period-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
    }
    .period-divider {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 1px 0 12px;
      flex-shrink: 0;
      align-self: center;
    }
    .period-year,
    .period-months,
    .period-range {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .period-box {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .period-box:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }
    .period-box.active,
    .period-box.year-active {
      color: #22d3ee;
      background: rgba(34, 211, 238, 0.1);
      border-color: rgba(34, 211, 238, 0.3);
    }
    .year-arrow { font-size: 14px; line-height: 1; opacity: 0.85; }
    .rank-list { list-style: none; overflow: hidden; }
    .rank-item {
      display: flex; align-items: center; gap: 12px;
      padding: 7px 16px; border-bottom: none;
    }
    .rank-item:nth-child(odd) { background: rgba(255,255,255,0.015); }
    .rank-item:nth-child(even) { background: transparent; }
    .rank-item:hover { background: rgba(34,211,238,0.08); }
    .rank-num {
      width: 22px; font-size: 13px; font-weight: 600;
      color: var(--text-dim); text-align: center; flex-shrink: 0;
    }
    .rank-item.top-1 .rank-num { color: var(--orange); }
    .rank-item.top-2 .rank-num { color: #c0c0c0; }
    .rank-item.top-3 .rank-num { color: #cd7f32; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      overflow: hidden; border: 1px solid var(--border); background: #1a1c24; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .rank-info { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rank-name { font-size: 13px; font-weight: 600; }
    .rank-crew { font-size: 12px; color: var(--text-dim); }
    .rank-stat {
      font-size: 13px; font-weight: 600; color: var(--cyan);
      flex-shrink: 0; text-align: right;
      min-width: 130px; font-variant-numeric: tabular-nums;
      line-height: 1;

    .rank-stat span span {
      font-size: 70%;
      opacity: 0.7;
      line-height: 1;
    }
    #listNav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #1c1f28;
      border: 1px solid rgba(255,255,255,0.06);
      border-top: none;
      border-radius: 0 0 14px 14px;
      padding: 10px 16px;
    }
    #listNav .page-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }
    #listNav .page-btn:hover:not(:disabled) {
      color: #67e8f9;
      border-color: rgba(34,211,238,0.35);
      background: rgba(34,211,238,0.1);
    }
    #listNav .page-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }
    #pageInfo {
      width: 52px;
      min-width: 52px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }
    .rank-item.empty {
      min-height: 48px;
      pointer-events: none;
      background: transparent !important;
    }
    #listNav #moreBtn,
    #listNav #foldBtn {
      width: 100%;
      padding: 12px 16px;
      margin: 0;
      background: transparent;
      border: none;
      color: #22d3ee;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    #listNav #foldBtn { color: #8b8f9a; }
    #listNav #moreBtn:hover,
    #listNav #foldBtn:hover {
      color: #67e8f9;
      font-weight: 700;
    }
    .footer {
      margin-top: auto; border-top: 1px solid var(--border);
      background: #08090c; padding: 28px 0 32px;
      overflow: visible;
    }
    .footer-inner {
      max-width: var(--content-max); margin: 0 auto;
      padding: 0 24px;
      font-size: 12px; color: var(--text-dim); line-height: 1.7;
    }
    .footer-inner p { margin-bottom: 6px; }
    .footer-copyright {
      margin-top: 14px; padding-top: 20px;
      border-top: 1px solid var(--border); color: var(--text-muted);
    }
    .footer-doc {
      margin-left: 12px;
      color: inherit;
      font-weight: 400;
      text-decoration: none;
    }
    .footer-doc:hover { font-weight: 700; }
    .footer-dot { margin: 0 8px; }
    .footer-row {
      position: relative;
      display: block;
      padding-right: 88px;
    }
    .partner-wrap {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      margin-top: 0;
    }
    .partner-btn {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0e1016;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      list-style: none;
    }
    .partner-btn::-webkit-details-marker { display: none; }
    .partner-btn:hover { color: #22d3ee; border-color: rgba(34,211,238,0.35); }
    .partner-pop {
      display: none;
      position: absolute;
      right: 0;
      left: auto;
      bottom: calc(100% + 8px);
      width: 280px;
      padding: 14px 16px;
      background: #16181f;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
      z-index: 200;
    }
    .partner-wrap[open] .partner-pop { display: block; }
    .footer-doc {
      margin-left: 12px;
      color: inherit;
      font-weight: 400;
      text-decoration: none;
    }
    .footer-doc:hover { font-weight: 700; }
    .footer-dot { margin: 0 8px; }
    .footer-row {
      position: relative;
      display: block;
      padding-right: 88px;
    }
    .partner-wrap {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      margin-top: 0;
    }
    .partner-btn {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0e1016;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
    }
    .partner-btn:hover { color: #22d3ee; border-color: rgba(34,211,238,0.35); }
    .partner-pop {
      display: none;
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      width: 280px;

      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
      z-index: 20;
    }
    .partner-wrap:hover .partner-pop { display: block; }
    .rank-layout { display: flex; gap: 24px; align-items: flex-start; }
    .rank-left { width: 60%; flex-shrink: 0; }
    .rank-right { width: 40%; display: flex; flex-direction: column; gap: 23px; }
    .side-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
    }
    .side-box-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }
    .side-box-body { padding: 8px 0; }
    .side-item {
      display: flex;
      align-items: center;
      justify-content: space-between;

    .side-item-name { color: var(--text); font-weight: 500; }

      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .side-empty {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .rank-layout { flex-direction: column; }
      .rank-left, .rank-right { width: 100%; }
    }
  </style>
</head>

        </div>

    </div>

        var cols = lines[i].match(/(?:[^",]+|"[^"]*")+/g) || [];

        var id = c[0] || "";

        list.push({
          id: id,
          name: name,
          aliases: aliases,
          race: c[3] || "",
          crew: c[4] || "FA",
          gender: c[5] || ""

        const rosterRes = await fetch(ROSTER_CSV);
        const rosterText = await rosterRes.text();
        const roster = parseRoster(rosterText);
        const dataRes = await fetch(url);
        const dataText = await dataRes.text();
        const lines = dataText.split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l; });
        let result = [];
        for (var i = 1; i < lines.length; i++) {
          var cols = lines[i].match(/(?:[^",]+|"[^"]*")+/g) || [];
          var c = cols.map(function (x) { return x.replace(/^"|"$/g, "").trim(); });
          var name = (c[0] || "").trim();
          if (!name || name === "이름") continue;
          var race = (c[1] || "").trim();
          var games = parseInt((c[2] || "").replace(/[^0-9]/g, ""), 10) || 0;
          var wins = parseInt((c[3] || "").replace(/[^0-9]/g, ""), 10) || 0;
          var losses = parseInt((c[4] || "").replace(/[^0-9]/g, ""), 10) || 0;
          var who = findRoster(name, roster);
          result.push({
            name: who ? who.name : name,
            id: who ? who.id : "",
            crew: who ? who.crew : "FA",
            race: race || (who ? who.race : ""),
            games: games,
            wins: wins,
            losses: losses
          });
        }
        result.sort(function (a, b) {
          if (b.games !== a.games) return b.games - a.games;
          return b.wins - a.wins;
        });
        originalData = result;
        resetAndRender();
        document.getElementById("rankArea").style.visibility = "visible";
        const now = new Date();
        const mm = String(now.getMonth() + 1).padStart(2, "0");
        const dd = String(now.getDate()).padStart(2, "0");
        const hh = String(now.getHours()).padStart(2, "0");
        const min = String(now.getMinutes()).padStart(2, "0");
        const updateEl = document.getElementById("updateTime");

          listenersBound = true;
          function goListTop() {
            var el = document.getElementById("rankTitle") || document.getElementById("rankArea");
            if (!el) return;
            var y = el.getBoundingClientRect().top + window.scrollY - 120;

          }
          const prevBtn = document.getElementById("prevPage");
          const nextBtn = document.getElementById("nextPage");
          if (prevBtn) prevBtn.addEventListener("click", function () {
            if (listPage > 0) { listPage--; renderMore(); goListTop(); }
          });
          if (nextBtn) nextBtn.addEventListener("click", function () {
            listPage++;
            renderMore();
            goListTop();
          });
          const clearFilterBtn = document.getElementById("clearFilterBtn");
          if (clearFilterBtn) clearFilterBtn.addEventListener("click", clearFilter);
          const clearFilterBottomBtn = document.getElementById("clearFilterBottomBtn");
          if (clearFilterBottomBtn) clearFilterBottomBtn.addEventListener("click", clearFilter);
          document.querySelectorAll(".period-months .period-box").forEach(function (btn) {
            btn.addEventListener("click", function () {
              document.querySelectorAll(".period-months .period-box").forEach(function (b) {
                b.classList.remove("active");
              });
              btn.classList.add("active");
              currentMonth = parseInt(btn.getAttribute("data-month"), 10);
              loadData(currentMonth);
            });
          });
          document.querySelectorAll(".period-range .period-box").forEach(function (btn) {
            btn.addEventListener("click", function () {
              document.querySelectorAll(".period-range .period-box").forEach(function (b) {
                b.classList.remove("active");
              });
              btn.classList.add("active");
            });
          });
        }
      } catch (err) {
        listEl.innerHTML = "<li style='padding:20px;color:#f87171;'>데이터 불러오기 실패</li>";
        document.getElementById("rankArea").style.visibility = "visible";
        console.error(err);
      }
    }
